<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.t{font-family:Arial,sans-serif;fill:#15213a}.h{font-size:34px;font-weight:700}.s{font-size:21px}.sm{font-size:18px}.box{rx:18;stroke-width:3}.line{stroke:#53627b;stroke-width:4;fill:none}</style></defs>
  <rect width="1600" height="900" fill="#f7f8fb"/><text x="70" y="72" class="t h">Modelo de dados atual — reconstruído do dump</text><text x="70" y="110" class="t sm">O dump contém mais estrutura do que as migrations versionadas.</text>
  <rect x="110" y="175" width="570" height="560" class="box" fill="#edf4ff" stroke="#3b70c5"/><rect x="110" y="175" width="570" height="70" rx="18" fill="#3b70c5"/><text x="395" y="220" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">users</text>
  <g class="t s"><text x="145" y="290"><tspan font-weight="700">PK</tspan> id · int unsigned</text><text x="145" y="335">name · varchar(255)</text><text x="145" y="380">type · varchar(255)</text><text x="145" y="425"><tspan font-weight="700">UQ</tspan> email · varchar(255)</text><text x="145" y="470">password · varchar(60)</text><text x="145" y="515">points · int unsigned</text><text x="145" y="560">matricula · varchar(45), nulo</text><text x="145" y="605">whatsapp · varchar(45), nulo</text><text x="145" y="650">data_nascimento · date, nulo</text><text x="145" y="695">remember_token + timestamps</text></g>
  <rect x="920" y="210" width="540" height="390" class="box" fill="#ecfaf4" stroke="#259773"/><rect x="920" y="210" width="540" height="70" rx="18" fill="#259773"/><text x="1190" y="255" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">points</text>
  <g class="t s"><text x="955" y="330"><tspan font-weight="700">PK</tspan> id · int unsigned</text><text x="955" y="380"><tspan font-weight="700">IDX</tspan> user_id · int unsigned</text><text x="955" y="430">motivo · varchar(100), nulo</text><text x="955" y="480">pontos · int (positivo/negativo)</text><text x="955" y="530">created_at · updated_at</text></g>
  <path d="M680 425H920" class="line"/><circle cx="705" cy="425" r="8" fill="#53627b"/><path d="M885 405L920 425L885 445" fill="none" stroke="#53627b" stroke-width="4"/><text x="790" y="398" text-anchor="middle" class="t sm">1 : N</text>
  <rect x="920" y="660" width="540" height="130" class="box" fill="#fff0f0" stroke="#c84a4a"/><text x="1190" y="708" text-anchor="middle" class="t s" font-weight="700">Risco de integridade</text><text x="1190" y="745" text-anchor="middle" class="t sm">Há índice em user_id, mas não há FK no dump.</text><text x="1190" y="775" text-anchor="middle" class="t sm">Saldo é duplicado em users.points.</text>
  <text x="110" y="820" class="t sm">Também existe password_resets(email, token, created_at); não possui chave primária.</text><text x="110" y="852" class="t sm">Amostra do dump: 53 usuários, 325 lançamentos; dados pessoais não são reproduzidos nesta documentação.</text>
</svg>
